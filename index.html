<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>UNM CS 412/512 HW3</title>
  <style>
    body {
      background: #111;
      color: #ccc;
      font-family: monospace;
    }

    canvas {
      border: 1px solid #444;
    }

    #layout {
      display: flex;
      gap: 40px;
      align-items: flex-start;
    }

    /* left column: SPIN, FRONT */
    #controls {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    #controls button {
      width: 100px;
      height: 50px;
    }

    /* center: canvas with one cross under each half */
    #crosses {
      display: flex;
    }

    .cross {
      width: 400px;              /* half the canvas width */
      display: grid;
      grid-template-columns: repeat(4, 50px);
      grid-template-rows: repeat(3, 50px);
      gap: 4px;
      justify-content: center;
      margin-top: 10px;
    }

    .cross button {
      width: 50px;
      height: 50px;
      padding: 0;
    }

    .cross .top   { grid-column: 2; grid-row: 1; }
    .cross .left  { grid-column: 1; grid-row: 2; }
    .cross .front { grid-column: 2; grid-row: 2; }
    .cross .right { grid-column: 3; grid-row: 2; }
    .cross .back  { grid-column: 4; grid-row: 2; }
    .cross .base  { grid-column: 2; grid-row: 3; }

    /* right column: counters and the 2 x 6 tile grid */
    #tiles {
      display: grid;
      grid-template-columns: repeat(2, 50px);
      grid-auto-rows: 50px;
      gap: 20px;
      margin-top: 10px;
    }

    .tile {
      border: 1px solid;
    }

    /* ---------------- button glow and press ---------------- */

    /* glow color (r, g, b) for every button glow */
    :root {
      --glow: 255, 255, 255;
    }

    /* two glows that add together:
       1. individual hover glow: box-shadow on the hovered button
       2. array glow: drop-shadow filter on the whole cross, around all of its buttons */

    button {
      transition: box-shadow 0.15s, transform 0.08s;
    }

    /* individual hover: strong glow, drawn above neighbours */
    button:hover:not(:disabled) {
      box-shadow: 0 0 16px 4px rgba(var(--glow), 0.9);
      position: relative;
      z-index: 1;
    }

    /* mouse down */
    button:active:not(:disabled) {
      transform: scale(0.9);
    }

    /* array glow, steady: while any enabled button in the cross is hovered */
    .cross {
      transition: filter 0.15s;
    }

    .cross:has(button:hover:not(:disabled)) {
      filter: drop-shadow(0 0 6px rgba(var(--glow), 0.8));
    }

    /* array glow, pulsing: main.js adds the "pulsing" class */
    .cross.pulsing {
      animation: arrayPulse 1.2s ease-in-out infinite;
    }

    @keyframes arrayPulse {
      0%, 100% { filter: drop-shadow(0 0 2px rgba(var(--glow), 0.15)); }
      50%      { filter: drop-shadow(0 0 8px rgba(var(--glow), 1)); }
    }
  </style>
</head>

<body>
  <h2>Cube Match Game!</h2>

  <!-- instructions popup: open on load, OK closes it (no JS needed) -->
  <dialog id="instructions" open>
    Cube faces are scrambled!<br>

    <p>Click on a face in the cube map to select.<br>
      Click on the other cube map's matching face.<br>
      Spin to show other sides.<br>
      Reset to face front again.<br>
      Match all patterns to faces to win.<br>
      When you run out of tries, you lose!.</p>

    <form method="dialog">
      <button>OK</button>
    </form>
  </dialog>

  <div id="layout">

    <div id="controls">
      <button id="spinBtn">SPIN</button>
      <button id="frontBtn">FRONT</button>
    </div>

    <div id="center">
      <canvas id="glcanvas" width="800" height="400"></canvas>

      <div id="crosses">
        <div class="cross" id="leftCross">
          <button class="top"   id="left-top">Top</button>
          <button class="left"  id="left-left">Left</button>
          <button class="front" id="left-front">Front</button>
          <button class="right" id="left-right">Right</button>
          <button class="back"  id="left-back">Back</button>
          <button class="base"  id="left-base">Base</button>
        </div>

        <div class="cross" id="rightCross">
          <button class="top"   id="right-top">Top</button>
          <button class="left"  id="right-left">Left</button>
          <button class="front" id="right-front">Front</button>
          <button class="right" id="right-right">Right</button>
          <button class="back"  id="right-back">Back</button>
          <button class="base"  id="right-base">Base</button>
        </div>
      </div>
    </div>

    <div id="status">
      <div>Matches: <span id="matches">0</span></div>
      <div>Tries Left: <span id="tries">10</span></div>

      <div id="tiles">
        <canvas class="tile" id="tile0" width="50" height="50"></canvas>
        <canvas class="tile" id="tile1" width="50" height="50"></canvas>
        <canvas class="tile" id="tile2" width="50" height="50"></canvas>
        <canvas class="tile" id="tile3" width="50" height="50"></canvas>
        <canvas class="tile" id="tile4" width="50" height="50"></canvas>
        <canvas class="tile" id="tile5" width="50" height="50"></canvas>
        <canvas class="tile" id="tile6" width="50" height="50"></canvas>
        <canvas class="tile" id="tile7" width="50" height="50"></canvas>
        <canvas class="tile" id="tile8" width="50" height="50"></canvas>
        <canvas class="tile" id="tile9" width="50" height="50"></canvas>
        <canvas class="tile" id="tile10" width="50" height="50"></canvas>
        <canvas class="tile" id="tile11" width="50" height="50"></canvas>
      </div>
    </div>

  </div>

  <script src="primitives.js"></script>
  <script src="transformations.js"></script>
  <script src="vertexShader.js"></script>
  <script src="fragmentShader.js"></script>
  <script src="init.js"></script>

  <script src="main.js"></script>
</body>

</html>
